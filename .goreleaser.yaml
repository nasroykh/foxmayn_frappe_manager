version: 2

project_name: ffm

before:
  hooks:
    - go mod tidy

builds:
  - id: ffm
    main: ./cmd/ffm
    binary: ffm
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/nasroykh/foxmayn_frappe_manager/internal/version.Version={{ .Version }}
      - -X github.com/nasroykh/foxmayn_frappe_manager/internal/version.Commit={{ .Commit }}
      - -X github.com/nasroykh/foxmayn_frappe_manager/internal/version.Date={{ .Date }}

archives:
  - id: ffm
    name_template: "ffm_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

# Linux packages, attached to the release next to the archives. They do not
# depend on a Docker package because its name differs between distributions
# (docker-ce, docker.io, moby-engine); ffm checks for Docker at run time.
nfpms:
  - id: ffm
    package_name: ffm
    file_name_template: "ffm_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    vendor: Foxmayn
    homepage: https://github.com/nasroykh/foxmayn_frappe_manager
    maintainer: nasroykh <nascodes@protonmail.com>
    description: Create and manage Frappe benches with Docker Compose, for development and production.
    license: MIT
    formats: [deb, rpm]
    bindir: /usr/bin

# A software bill of materials (SPDX, by syft) for every archive.
sboms:
  - artifacts: archive

checksum:
  name_template: "checksums.txt"

# checksums.txt is signed with the Ed25519 key in FFM_RELEASE_SIGNING_KEY.
# ffm update refuses a release without a valid checksums.txt.sig; relsign
# refuses to sign with a key that the binaries being released cannot verify.
signs:
  - id: checksums
    artifacts: checksum
    cmd: go
    args: ["run", "./tools/relsign", "sign", "${artifact}", "${signature}"]
    signature: "${artifact}.sig"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch
