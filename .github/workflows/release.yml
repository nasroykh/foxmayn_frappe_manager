name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write     # OIDC token for the build-provenance attestation
  attestations: write # publish the attestation

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # A tag must not publish a binary that fails vet, the tests or govulncheck.
      - name: Verify
        run: |
          go vet ./...
          go test -race ./...
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      # syft, which GoReleaser's sboms: step runs.
      - name: Install syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FFM_RELEASE_SIGNING_KEY: ${{ secrets.FFM_RELEASE_SIGNING_KEY }}

      # Signed, verifiable provenance for every published file:
      # gh attestation verify <file> -R nasroykh/foxmayn_frappe_manager
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/checksums.txt
            dist/checksums.txt.sig
